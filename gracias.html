<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documentos recibidos · Gaby Orona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--tinta:#1E3354;--tinta-suave:#4A5C78;--cobre:#A4552F;--plano:#E9EEF3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:Montserrat,Arial,Helvetica,sans-serif;color:var(--tinta);
  background-color:var(--plano);
  background-image:linear-gradient(rgba(30,51,84,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(30,51,84,.07) 1px,transparent 1px),linear-gradient(rgba(30,51,84,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(30,51,84,.035) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px}
.tarjeta{max-width:520px;width:100%;background:#fff;border-radius:28px;padding:40px 32px 32px;text-align:center;box-shadow:0 24px 60px -28px rgba(30,51,84,.35)}
.casa{width:190px;margin:-100px auto 8px;display:block;filter:drop-shadow(0 16px 16px rgba(30,51,84,.2))}
h1{font-size:28px;line-height:1.2;font-weight:800;margin:0 0 10px}
p{margin:0 auto;max-width:38ch;color:var(--tinta-suave);line-height:1.55}
.logo{width:140px;margin:28px auto 0;display:block}
a.volver{display:inline-block;margin-top:22px;color:var(--cobre);font-weight:700;text-decoration:none}
a.volver:hover{text-decoration:underline}
@media (prefers-reduced-motion:no-preference){
  .casa{animation:cae .9s cubic-bezier(.3,1.4,.5,1) both}
  @keyframes cae{from{opacity:0;transform:translateY(-30px) scale(.9)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
  <main class="tarjeta">
    <img class="casa" src="casa-2.png" alt="">
    <h1>Recibí sus documentos</h1>
    <p>Gracias. Los reviso y le escribo pronto. Si le falta algún documento, puede volver al formulario y enviarlo cuando lo tenga.</p>
    <a class="volver" href="./">Enviar más documentos</a>
    <img class="logo" src="logo-orona.png" alt="Orona Real Estate">
  </main>
</body>
</html>
